<!-- suppliers/includes/supplier_card.html -->
<div class="col-md-4 mb-3">
    <div class="card h-100">
        <div class="card-body">
            <h5 class="card-title">
                <a href="{% url 'suppliers:detail' supplier.id %}">{{ supplier.name }}</a>
            </h5>
            <p class="card-text">ИНН: {{ supplier.inn }}</p>
            <p class="card-text">Дата регистрации: {{ supplier.created_at }}</p>
        </div>
    </div>
</div>
