{% extends "base.html" %}

{% block title %}Товары — SupplyManager{% endblock %}

{% block content %}
<h1>Товары</h1>
<p>Всего товаров: {{ products|length }}</p>

<div class="row">
    {% for product in products %}
        {% include "products/includes/product_card.html" %}
    {% empty %}
        <p>Товары не найдены.</p>
    {% endfor %}
</div>
{% endblock %}
